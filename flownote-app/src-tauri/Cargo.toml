[package]
name = "flownote"
version = "0.1.2"
description = "FlowNote - Markdown + HTML 混合笔记系统"
authors = ["FlowNote Team"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
uuid = { version = "1.26.0", features = ["v4"] }
regex = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tauri = { version = "2.2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
